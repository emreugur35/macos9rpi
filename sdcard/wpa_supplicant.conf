# Wi-Fi settings for macos9rpi ("ether wlan" in macos9rpi.txt)
#
# Put your network name (ssid) and password (psk) below, and your
# two-letter country code (e.g. TR, DE, GB, US) so all local channels
# can be used. WPA2-Personal (or WPA/WPA2 mixed) and open networks work.
# WPA3-only networks do not.

country=US

network={
	ssid="your-network-name"
	psk="your-password"
	key_mgmt=WPA-PSK
	#scan_ssid=1		# uncomment for a hidden network
}

# Open network (no password): use this instead
#network={
#	ssid="your-network-name"
#	key_mgmt=NONE
#}
